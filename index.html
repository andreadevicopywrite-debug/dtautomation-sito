<head>

<title>DT Automation</title>
<style>
:root { --fondo: #faf8f4; --testo: #1c1b19; --font: Georgia, "Times New Roman", serif; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--fondo); color: var(--testo); font-family: var(--font);
       min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
a { color: var(--testo); }
a:focus-visible { outline: 2px solid var(--testo); outline-offset: 3px; }
</style>
</head>
